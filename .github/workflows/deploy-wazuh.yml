name: Deploy rules to Wazuh

on:
  push:
    branches: [main]
    paths:
      - 'detections/wazuh/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy custom rules via Wazuh API
        env:
          WAZUH_API_URL: https://localhost:55000
          WAZUH_API_USER: wazuh-wui
          WAZUH_API_PASS_FILE: /home/ctum/.wazuh-api-pass
        run: |
          PASS=$(cat "$WAZUH_API_PASS_FILE")
          TOKEN=$(curl -sk -X POST "$WAZUH_API_URL/security/user/authenticate" \
            -u "$WAZUH_API_USER:$PASS" | python3 -c "import sys,json;print(json.load(sys.stdin)['data']['token'])")
          curl -sk -X PUT -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/octet-stream" \
            "$WAZUH_API_URL/rules/files/local_rules.xml?overwrite=true" \
            --data-binary @detections/wazuh/custom_rules.xml \
            -w "\nHTTP:%{http_code}\n"

      - name: Verify rules loaded
        env:
          WAZUH_API_URL: https://localhost:55000
          WAZUH_API_USER: wazuh-wui
          WAZUH_API_PASS_FILE: /home/ctum/.wazuh-api-pass
        run: |
          PASS=$(cat "$WAZUH_API_PASS_FILE")
          TOKEN=$(curl -sk -X POST "$WAZUH_API_URL/security/user/authenticate" \
            -u "$WAZUH_API_USER:$PASS" | python3 -c "import sys,json;print(json.load(sys.stdin)['data']['token'])")
          curl -sk -H "Authorization: Bearer $TOKEN" \
            "$WAZUH_API_URL/rules?ruleset=custom_rules.xml&limit=20" | head -c 400