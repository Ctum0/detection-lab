title: Windows Credential Dumping via LSASS Access
id: 5a9f52de-50fa-4693-8942-9c626b3d7858
status: test
description: >
  Detects processes opening a handle to LSASS (TargetImage lsass.exe) with
  access masks associated with memory dumping (Sysmon Event ID 10,
  process_access). LSASS holds credentials, hashes and tickets, so handle
  access with these masks strongly indicates credential-dumping tooling
  such as Mimikatz or comsvcs MiniDump. Expected behavior: alert on any
  non-excluded process granted a sensitive LSASS access mask.
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: Sithum
date: 2026-09-26
tags:
  - attack.t1003.001
  - attack.ta0006
logsource:
  category: process_access
  product: windows
detection:
  selection:
    EventID: 10
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess:
      - '0x1010'
      - '0x1410'
      - '0x1438'
      - '0x143a'
      - '0x1fffff'
  condition: selection
falsepositives:
  - Endpoint security products legitimately inspecting LSASS
  - Rare Windows built-in processes during updates
level: critical
