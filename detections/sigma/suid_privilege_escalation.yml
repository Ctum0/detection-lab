title: Linux SUID Binary Privilege Escalation Attempt
id: 5c85ca70-0abd-408b-8031-306946714092
status: test
description: >
  Detects attempts to set the SUID bit via chmod (u+s, 4755, 4750, 4777)
  observed through auditd EXECVE telemetry. Attackers set SUID on binaries
  they control to escalate to the file owner's privileges on next execution.
  Expected behavior: alert on any chmod invocation carrying a SUID mode, as
  legitimate SUID changes are rare and normally change-managed.
references:
  - https://attack.mitre.org/techniques/T1548/001/
author: Sithum
date: 2026-09-26
tags:
  - attack.t1548.001
  - attack.ta0004
  - attack.ta0005
logsource:
  product: linux
  service: auditd
detection:
  selection_execve:
    type: 'EXECVE'
  selection_chmod:
    exe|endswith:
      - '/chmod'
      - '/bin/chmod'
      - '/usr/bin/chmod'
  selection_suid_a1:
    a1|contains:
      - 'u+s'
      - '4755'
      - '4750'
      - '4777'
  selection_suid_a2:
    a2|contains:
      - 'u+s'
      - '4755'
      - '4750'
      - '4777'
  condition: selection_execve and selection_chmod and 1 of selection_suid_*
falsepositives:
  - Hardening scripts or package post-installs setting SUID deliberately
  - Admin testing in the lab (coordinate before running)
level: medium
