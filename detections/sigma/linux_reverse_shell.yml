title: Linux Reverse Shell Execution
id: bac3d49f-4520-4280-8173-dcd883f8a54d
status: test
description: >
  Detects interactive reverse-shell patterns via auditd EXECVE telemetry:
  a shell (bash/sh/dash) started interactive (-i) with its I/O redirected
  to a network socket (/dev/tcp/ or >& redirection), or a netcat-family
  tool (nc, ncat, netcat, socat) executed with -e to bind a shell to the
  network. Expected behavior: alert on either pattern; both are near-certain
  compromise indicators on lab servers.
references:
  - https://attack.mitre.org/techniques/T1059/004/
author: Sithum
date: 2026-09-26
tags:
  - attack.t1059.004
  - attack.ta0002
logsource:
  product: linux
  service: auditd
detection:
  selection_shell:
    exe|endswith:
      - '/bash'
      - '/sh'
      - '/dash'
  selection_interactive:
    a1|contains: '-i'
  selection_sock_a2:
    a2|contains:
      - '/dev/tcp/'
      - '>&'
  selection_sock_a3:
    a3|contains:
      - '/dev/tcp/'
      - '>&'
  selection_nc:
    exe|endswith:
      - '/nc'
      - '/ncat'
      - '/netcat'
      - '/socat'
  selection_nc_e_a1:
    a1|contains: '-e'
  selection_nc_e_a2:
    a2|contains: '-e'
  condition: >-
    (selection_shell and selection_interactive and 1 of selection_sock_*)
    or (selection_nc and 1 of selection_nc_e_*)
falsepositives:
  - Admin troubleshooting with intentional reverse shells during lab exercises
level: high
