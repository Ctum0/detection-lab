title: Clearing Windows Security Event Log
id: 8325981c-6935-4796-a9ae-af3186f18b3a
status: test
description: >
  Detects clearing of the Windows Security event log via event 1102. Log
  clearing is a defence-evasion step attackers take to hide their tracks,
  and on a lab victim host it is almost never legitimate. Expected
  behavior: alert on every 1102 and treat as a potential compromise
  indicator until proven to be authorised maintenance.
references:
  - https://attack.mitre.org/techniques/T1070/001/
author: Sithum
date: 2026-09-26
tags:
  - attack.t1070.001
  - attack.ta0005
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 1102
  condition: selection
falsepositives:
  - Authorised admin clearing logs during lab rebuilds
level: high
